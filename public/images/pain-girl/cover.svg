<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Pain Girl — seasonal collection">
  <defs>
    <linearGradient id="pg-sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0b2740" />
      <stop offset="0.55" stop-color="#123049" />
      <stop offset="1" stop-color="#2a1424" />
    </linearGradient>
    <radialGradient id="pg-glow" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.32" />
      <stop offset="0.6" stop-color="#f472b6" stop-opacity="0.14" />
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pg-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#pg-sky)" />
  <rect width="1200" height="1200" fill="url(#pg-glow)" />

  <!-- Record grooves, echoing the vinyl labels the rest of the site uses -->
  <g fill="none" stroke="#fbbf24" stroke-opacity="0.10">
    <circle cx="600" cy="470" r="250" />
    <circle cx="600" cy="470" r="278" />
    <circle cx="600" cy="470" r="306" />
    <circle cx="600" cy="470" r="334" />
    <circle cx="600" cy="470" r="362" />
  </g>
  <circle cx="600" cy="470" r="190" fill="#fbbf24" fill-opacity="0.06" stroke="#fbbf24" stroke-opacity="0.35" />

  <!-- Rising notes -->
  <g fill="#fbbf24" fill-opacity="0.55">
    <circle cx="330" cy="330" r="9" />
    <circle cx="420" cy="286" r="6" />
    <circle cx="790" cy="300" r="7" />
    <circle cx="868" cy="346" r="5" />
  </g>
  <g stroke="#fbbf24" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round">
    <path d="M330 330 L330 470" />
    <path d="M420 286 L420 470" />
    <path d="M790 300 L790 470" />
    <path d="M868 346 L868 470" />
  </g>

  <text x="600" y="905" text-anchor="middle" fill="#ffffff" fill-opacity="0.94"
        font-family="Playfair Display, Georgia, serif" font-size="122" letter-spacing="4">Pain Girl</text>
  <text x="600" y="972" text-anchor="middle" fill="#fcd34d" fill-opacity="0.85"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" letter-spacing="11">SEASONAL COLLECTION</text>
  <line x1="360" y1="1030" x2="840" y2="1030" stroke="url(#pg-edge)" stroke-width="3" />
  <text x="600" y="1092" text-anchor="middle" fill="#e7e5e4" fill-opacity="0.5"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" letter-spacing="7">GALLERY</text>
</svg>