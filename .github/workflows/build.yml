name: Build and validate
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m py_compile deploy/backups/backup.py deploy/backups/restore.py
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: docker build -t liquidmusic:test .
